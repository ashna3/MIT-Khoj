<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>MIT Khoj - Lost and Found Management System</title>
  <link rel="stylesheet" href="css/style.css?v=20260406e" />
</head>
<body>
  <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F1E4E8; padding: 20px;">
    <div style="margin-bottom: 40px; text-align: center;">
      <h1 class="brand-title" style="font-size: 48px; margin-bottom: 8px; color: #0B132B;">MIT Khoj</h1>
      <p style="color: #666; font-size: 14px;">Lost and Found Management System</p>
    </div>

    <div class="card" style="max-width: 460px; width: 100%;">
      <div style="display: flex; gap: 12px; margin-bottom: 32px; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap;">
        <button class="tab-btn active" data-tab="student-signin" style="background: none; border: none; padding: 12px 16px; font-size: 15px; font-weight: 500; color: #F96E46; cursor: pointer; border-bottom: 2px solid #F96E46; margin-bottom: -1px;">Student Sign In</button>
        <button class="tab-btn" data-tab="admin-signin" style="background: none; border: none; padding: 12px 16px; font-size: 15px; font-weight: 500; color: #999; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;">Admin Sign In</button>
        <button class="tab-btn" data-tab="signup" style="background: none; border: none; padding: 12px 16px; font-size: 15px; font-weight: 500; color: #999; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;">Sign Up</button>
      </div>

      <form id="student-signin-form" class="tab-content active" style="display: block;">
        <h2 style="font-size: 24px; margin-bottom: 8px; color: #0B132B;">Student Sign In</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 24px;">Use your registration number to access your student account.</p>

        <div class="form-group">
          <label for="signin-reg-no">Registration Number</label>
          <input type="text" id="signin-reg-no" name="reg_no" placeholder="Enter your registration number" required />
        </div>

        <div class="form-group">
          <label for="signin-password">Password</label>
          <input type="password" id="signin-password" name="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;">Sign In</button>
        <button type="button" id="forgot-password-btn" class="btn btn-secondary" style="width: 100%; margin-top: 12px;">Forgot password?</button>
      </form>

      <form id="admin-signin-form" class="tab-content" style="display: none;">
        <h2 style="font-size: 24px; margin-bottom: 8px; color: #0B132B;">Admin Sign In</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 24px;">Use your admin number to access the management dashboard.</p>

        <div class="form-group">
          <label for="signin-admin-no">Admin Number</label>
          <input type="text" id="signin-admin-no" name="admin_no" placeholder="Enter your admin number" required />
        </div>

        <div class="form-group">
          <label for="signin-admin-password">Password</label>
          <input type="password" id="signin-admin-password" name="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;">Sign In as Admin</button>
        <button type="button" id="forgot-admin-password-btn" class="btn btn-secondary" style="width: 100%; margin-top: 12px;">Forgot password?</button>
      </form>

      <form id="signup-form" class="tab-content" style="display: none;">
        <h2 style="font-size: 24px; margin-bottom: 8px; color: #0B132B;">Create Student Account</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 24px;">Join MIT Khoj to report and find items.</p>

        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" name="name" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label for="signup-reg-no">Registration Number</label>
          <input type="text" id="signup-reg-no" name="reg_no" placeholder="Enter your registration number" required />
        </div>

        <div class="form-group">
          <label for="signup-phone">Phone Number</label>
          <input type="text" id="signup-phone" name="phone" placeholder="Enter 10-digit phone number" required />
        </div>

        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" placeholder="Minimum 8 characters" required />
        </div>

        <div class="form-group">
          <label for="signup-confirm-password">Confirm Password</label>
          <input type="password" id="signup-confirm-password" name="confirm_password" placeholder="Re-enter your password" required />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;">Create Account</button>
      </form>
    </div>
  </div>

  <div id="reset-password-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Reset Password</h2>
        <button class="modal-close" id="reset-password-close">x</button>
      </div>
      <div class="modal-body">
        <form id="reset-password-form">
          <div class="form-group">
            <label for="reset-account-type">Account Type</label>
            <select id="reset-account-type" name="login_type" required>
              <option value="student">Student</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="form-group">
            <label for="reset-identifier" id="reset-identifier-label">Registration Number</label>
            <input type="text" id="reset-identifier" name="identifier" required />
          </div>
          <div class="form-group">
            <label for="reset-phone">Phone Number</label>
            <input type="text" id="reset-phone" name="phone" required />
          </div>
          <div class="form-group">
            <label for="reset-new-password">New Password</label>
            <input type="password" id="reset-new-password" name="new_password" required />
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Reset Password</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=20260406e"></script>
  <script src="js/auth.js?v=20260406e"></script>
  <script src="js/main.js?v=20260406e"></script>
  <script src="js/pages/auth.js?v=20260406e"></script>
</body>
</html>
