<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Claims — MIT Khoj</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h2 class="brand-title" style="font-size: 20px;">MIT Khoj</h2>
      </div>

      <nav class="sidebar-nav">
        <li class="sidebar-nav-item">
          <a href="student_dashboard.html" class="sidebar-nav-link">Dashboard</a>
        </li>
        <li class="sidebar-nav-item">
          <a href="my_lost_reports.html" class="sidebar-nav-link">My Lost Reports</a>
        </li>
        <li class="sidebar-nav-item">
          <a href="browse_items.html" class="sidebar-nav-link">Browse Found Items</a>
        </li>
        <li class="sidebar-nav-item">
          <a href="report_found.html" class="sidebar-nav-link">Report Found Item</a>
        </li>
        <li class="sidebar-nav-item">
          <a href="report_lost.html" class="sidebar-nav-link">Report Lost Item</a>
        </li>
        <li class="sidebar-nav-item">
          <a href="my_claims.html" class="sidebar-nav-link active">My Claims</a>
        </li>
        <li class="sidebar-nav-item">
          <a href="item_timeline.html" class="sidebar-nav-link">Item Timeline</a>
        </li>
      </nav>

      <div class="sidebar-bottom">
        <div class="sidebar-user">
          <span class="sidebar-user-name" id="sidebar-user-name">Loading...</span>
          <span class="sidebar-user-id" id="sidebar-user-reg-no">—</span>
        </div>
        <button class="btn btn-secondary" style="width: 100%;" id="logout-btn">
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Topbar -->
      <div class="topbar">
        <h1 class="topbar-title">My Claims</h1>
        <div class="topbar-right">
          <span id="topbar-user-name">Loading...</span>
        </div>
      </div>

      <!-- Content -->
      <div class="content">
        <div class="table-container">
          <table id="claims-table">
            <thead>
              <tr>
                <th>Item Title</th>
                <th>Date Claimed</th>
                <th>Ownership Score</th>
                <th>Status</th>
                <th>Admin Review Date</th>
              </tr>
            </thead>
            <tbody id="claims-tbody">
              <tr>
                <td colspan="5" style="text-align: center; padding: 40px;">
                  <div class="empty-state">
                    <div class="empty-state-icon">📋</div>
                    <div class="empty-state-title">Loading...</div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pages/my-claims.js"></script>
</body>
</html>
