<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Manage Claims — MIT Khoj</title>
  <link rel="stylesheet" href="css/style.css?v=20260406c" />
</head>
<body>
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h2 class="brand-title" style="font-size: 20px;">MIT Khoj</h2>
      </div>

      <nav class="sidebar-nav">
        <li class="sidebar-nav-item">
          <a href="admin_dashboard.html" class="sidebar-nav-link">Dashboard</a>
        </li>
        <li class="sidebar-nav-item">
          <a href="admin_items.html" class="sidebar-nav-link">Manage Items</a>
        </li>
        <li class="sidebar-nav-item">
          <a href="admin_claims.html" class="sidebar-nav-link active">Manage Claims</a>
        </li>
        <li class="sidebar-nav-item">
          <a href="admin_lost_reports.html" class="sidebar-nav-link">Lost Reports</a>
        </li>
        <li class="sidebar-nav-item">
          <a href="admin_analytics.html" class="sidebar-nav-link">Analytics</a>
        </li>
        <li class="sidebar-nav-item">
          <a href="admin_users.html" class="sidebar-nav-link">User Management</a>
        </li>
      </nav>

      <div class="sidebar-bottom">
        <div class="sidebar-user">
          <span class="sidebar-user-name" id="sidebar-user-name">Loading...</span>
          <span class="sidebar-user-id" id="sidebar-user-reg-no">—</span>
        </div>
        <button class="btn btn-secondary" style="width: 100%;" id="logout-btn">
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Topbar -->
      <div class="topbar">
        <h1 class="topbar-title">Manage Claims</h1>
        <div class="topbar-right">
          <span id="topbar-user-name">Loading...</span>
        </div>
      </div>

      <!-- Content -->
      <div class="content">
        <!-- Filter Bar -->
        <div class="card" style="margin-bottom: 24px;">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="status-filter">Status</label>
              <select id="status-filter">
                <option value="">All Status</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="search-input">Search by Claimant Name</label>
              <input
                type="text"
                id="search-input"
                placeholder="Search..."
              />
            </div>
          </div>
        </div>

        <!-- Claims Table -->
        <div class="table-container">
          <table id="claims-table">
            <thead>
              <tr>
                <th>Claim ID</th>
                <th>Item Title</th>
                <th>Claimant Name</th>
                <th>Reg No</th>
                <th>Date Claimed</th>
                <th>Proof Description</th>
                <th>Ownership Score</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="claims-tbody">
              <tr>
                <td colspan="9" style="text-align: center; padding: 40px;">
                  <div class="empty-state">
                    <div class="empty-state-icon">📋</div>
                    <div class="empty-state-title">Loading...</div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js?v=20260406c"></script>
  <script src="js/auth.js?v=20260406c"></script>
  <script src="js/main.js?v=20260406c"></script>
  <script src="js/pages/admin-claims.js?v=20260406c"></script>
</body>
</html>
